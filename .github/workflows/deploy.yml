name: Build dan deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Cek asap di Chromium sungguhan terhadap hasil build; deploy batal bila ada error konsol.
      - run: npx playwright install --with-deps chromium
      - name: Smoke check (Playwright)
        run: |
          npm run preview -- --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/instasmart/ >/dev/null && break; sleep 1; done
          npm run smoke
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: out/screenshots
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
